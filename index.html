<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For My Love 💖</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Glowing name + question -->
  <h1 class="glow-name">
    💓 <span id="hisName">Do</span> 💓 <br />
    Do you love me?
  </h1>

  <!-- Video + Photo side by side -->
  <div class="video-photo-container">
    <video controls autoplay loop playsinline>
      <source src="songgg.mp4" type="video/mp4">
    </video>
    
    <img src="him.jpg" alt="His Photo" class="side-photo" />
  </div>

  <!-- Buttons -->
  <div class="buttons">
    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO 😈</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
